<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed — Julia & Julie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://js.stripe.com/v3/"></script>
    <!-- Meta Pixel Code -->
    <script>!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','3832792887031077');fbq('track','PageView');</script>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=3832792887031077&ev=PageView&noscript=1"/></noscript>
    <!-- End Meta Pixel Code -->
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f7; display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; padding: 12px; color: #1a1a1a; }
        .card { background: white; border-radius: 16px; padding: 18px 20px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 4px 30px rgba(0,0,0,0.05); }

        .store-logo { height: 40px; margin: 0 auto 12px; display: block; }

        .icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 22px; }
        .icon.success { background: #f9e8f0; color: #7a3050; }
        .icon.pending { background: #f9e8f0; color: #7a3050; }
        .icon.failure { background: #ffebee; color: #c62828; }

        h1 { font-size: 18px; margin-bottom: 4px; }
        p { color: #666; margin-bottom: 10px; line-height: 1.4; font-size: 13px; }

        .btn-home { display: block; text-decoration: none; color: #7a3050; font-weight: 700; border: 1px solid #7a3050; padding: 10px; border-radius: 8px; transition: 0.2s; font-size: 13px; margin-top: 10px; }
        .btn-home:hover { background: #fdf0f5; }
    </style>
</head>
<body>

<div class="card">
    <img src="logo.png" alt="Julia & Julie" class="store-logo">
    <div id="status-icon" class="icon success"><i class="fas fa-check-circle"></i></div>
    <h1 id="status-title">Payment Confirmed!</h1>
    <p id="status-desc">Thank you for your order. It will be shipped soon.</p>

    <a href="/" class="btn-home">Back to Home</a>
</div>

<script>
const STRIPE_PUBLISHABLE_KEY = 'pk_test_51Tr5q8GWR2Q7aHtvwYQyTLVq1YQ1LPFxERF0KGFxfWLih469bVW77Zjou6CP1W87FAaGpirSwtkvDwO1RcITAXb800OAwtV0dH';
const params = new URLSearchParams(window.location.search);
const status = params.get('status');
const clientSecret = params.get('payment_intent_client_secret');

function showFailure() {
    document.getElementById('status-icon').className = 'icon failure';
    document.getElementById('status-icon').innerHTML = '<i class="fas fa-times-circle"></i>';
    document.getElementById('status-title').innerText = 'Payment Declined';
    document.getElementById('status-desc').innerText  = 'We couldn\'t process your payment. Please try again.';
}

function showPending() {
    document.getElementById('status-icon').className = 'icon pending';
    document.getElementById('status-icon').innerHTML = '<i class="fas fa-clock"></i>';
    document.getElementById('status-title').innerText = 'Payment Pending';
    document.getElementById('status-desc').innerText  = 'We\'re confirming your payment. You\'ll receive an email as soon as it\'s approved.';
}

if (status === 'rejected') {
    showFailure();
} else if (status === 'pending') {
    showPending();
} else if (clientSecret) {
    // Landed here via a Stripe redirect (e.g. 3D Secure). Confirm the real status.
    const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
    stripe.retrievePaymentIntent(clientSecret).then(({ paymentIntent }) => {
        if (!paymentIntent) return;
        if (paymentIntent.status === 'succeeded' || paymentIntent.status === 'processing') {
            if (!sessionStorage.getItem('jj_thankyou_pur_' + paymentIntent.id) && typeof fbq !== 'undefined') {
                sessionStorage.setItem('jj_thankyou_pur_' + paymentIntent.id, '1');
                fbq('track', 'Purchase', { value: paymentIntent.amount / 100, currency: paymentIntent.currency.toUpperCase(), content_ids: ['sutia-hanna-30'], content_type: 'product' });
            }
        } else {
            showFailure();
        }
    });
}
// Note: for the non-redirect flow, the 'Purchase' Meta Pixel event fires from
// checkout.html right before it sends the customer here, so it isn't fired twice.
</script>
</body>
</html>
